name: local-validation
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --group dev
      - run: uv run ruff check src/ev_assignment_experiments tests/unit tests/integration
      - run: uv run pytest tests/unit tests/integration -q
      - name: Portable scientific regression tests
        shell: bash
        run: |
          for name in probability_check probability_phase1 random_streams first_stage recourse native_gurobi zero_presolve native_highs; do
            uv run python -m unittest discover -s tests/scientific -p "test_${name}.py" -v || exit 1
          done
      - run: uv build --wheel
      # No SSH, no solver license, and no production experiment dispatch in CI.
