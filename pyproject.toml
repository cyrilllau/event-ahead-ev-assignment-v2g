[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-assignment"
version = "0.2.0.dev0"
description = "Reproducible IEEE33 EV assignment experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.2",
    "scipy==1.18.1",
    "networkx==3.6.1",
    "psutil>=7,<8",
    "matplotlib==3.10.7",
]

[project.scripts]
ev-assignment = "ev_assignment_experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ev_assignment*", "ev_assignment_experiments*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.optional-dependencies]
gurobi = ["gurobipy==12.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["reference", ".venv"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["gurobi: requires an explicitly configured commercial solver", "private_data: requires separately managed historical inputs"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/ev_assignment_experiments/**/*.py", "tests/unit/**/*.py", "tests/integration/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
